<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog do André</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      color: #1c1e21;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #007bf5, #0056b3);
      color: white;
      text-align: center;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 2rem;
      letter-spacing: 1px;
    }

    .post-form {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 90px;
      padding: 12px;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      resize: none;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }

    textarea:focus {
      border-color: #007bf5;
    }

    .form-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    input[type="file"] {
      font-size: 14px;
      color: #555;
    }

    .btn-submit {
      background-color: #007bf5;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: #0056b3;
    }

    .post-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 15px;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .post-content {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 12px;
      word-wrap: break-word;
    }

    .post-image {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .post-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #e4e6eb;
      padding-top: 12px;
      flex-wrap: wrap;
    }

    .action-btn {
      background: #f0f2f5;
      border: 1px solid transparent;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #4b4f56;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #e4e6eb;
    }

    /* Estado ativado ao clicar */
    .action-btn.active {
      background-color: #e7f3ff;
      color: #1877f2;
      border-color: #1877f2;
    }

    .action-btn.active .heart-icon {
      fill: #e53935;
    }

    .heart-icon {
      width: 18px;
      height: 18px;
      fill: #757575;
      transition: fill 0.2s;
    }

    .btn-delete {
      background: #ffebee;
      color: #c62828;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      margin-left: auto;
      transition: background 0.2s;
    }

    .btn-delete:hover {
      background: #ffcdd2;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>blog do andré</h1>
    </header>

    <div class="post-form">
      <textarea id="postInput" placeholder="O que você deseja compartilhar hoje, André?"></textarea>
      <div class="form-controls">
        <input type="file" id="imageInput" accept="image/*">
        <button class="btn-submit" onclick="criarPostagem()">Publicar</button>
      </div>
    </div>

    <div id="postsFeed"></div>
  </div>

  <script>
    function criarPostagem() {
      const inputTexto = document.getElementById('postInput');
      const inputImagem = document.getElementById('imageInput');
      const texto = inputTexto.value.trim();
      const arquivo = inputImagem.files[0];

      if (!texto && !arquivo) {
        alert('Escreva uma mensagem ou adicione uma imagem!');
        return;
      }

      if (arquivo) {
        const reader = new FileReader();
        reader.onload = function(e) {
          adicionarPostAoFeed(texto, e.target.result);
        };
        reader.readAsDataURL(arquivo);
      } else {
        adicionarPostAoFeed(texto, null);
      }

      inputTexto.value = '';
      inputImagem.value = '';
    }

    function adicionarPostAoFeed(texto, imagemSrc) {
      const feed = document.getElementById('postsFeed');
      const novoPost = document.createElement('div');
      novoPost.className = 'post-card';

      let htmlConteudo = '';
      if (texto) {
        htmlConteudo += `<p class="post-content">${texto.replace(/\n/g, '<br>')}</p>`;
      }
      if (imagemSrc) {
        htmlConteudo += `<img src="${imagemSrc}" class="post-image" alt="Imagem anexada">`;
      }

      novoPost.innerHTML = `
        ${htmlConteudo}
        <div class="post-actions">
          <button class="action-btn" onclick="alternarInteracao(this)">
            <svg class="heart-icon" viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span class="count">0</span>
          </button>

          <button class="action-btn" onclick="alternarInteracao(this)">
            👍 <span class="count">0</span>
          </button>

          <button class="action-btn" onclick="alternarInteracao(this)">
            👎 <span class="count">0</span>
          </button>

          <button class="btn-delete" onclick="deletarPost(this)">Excluir</button>
        </div>
      `;

      feed.prepend(novoPost);
    }

    function alternarInteracao(botao) {
      const contador = botao.querySelector('.count');
      let valorAtual = parseInt(contador.textContent);

      if (botao.classList.contains('active')) {
        botao.classList.remove('active');
        contador.textContent = valorAtual - 1;
      } else {
        botao.classList.add('active');
        contador.textContent = valorAtual + 1;
      }
    }

    function deletarPost(botao) {
      const postCard = botao.closest('.post-card');
      postCard.remove();
    }
  </script>

</body>
</html>
